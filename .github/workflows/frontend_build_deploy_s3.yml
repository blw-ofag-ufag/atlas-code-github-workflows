name: Frontend Build and Publish Versioned Release to S3
run-name: Publish Release - ${{ inputs.environment }} - ${{ inputs.version }}
on:
  workflow_call:
    inputs:
      enable:
        description: 'Enable build and publish'
        required: false
        default: true
        type: boolean
      version:
        required: true
        type: string
        description: "Version of the application being published, used for the versioned S3 release path"
      environment:
        type: string
        required: true
        description: "environment to deploy to, used for selecting correct AWS credentials based on environment specific secrets and variables"
      aws-region:
        type: string
        required: true
        description: "AWS region for deployment and AWS CLI commands"
      frontend-s3-bucket:
        type: string
        required: true
        description: "S3 bucket name for frontend deployment"
      build-configuration:
        type: string
        required: false
        default: "dev"
        description: "Build configuration for the frontend application, e.g. dev, prod, int, used to adjust build settings and select correct environment specific variables if needed"
    secrets:
      AWS_OIDC_ROLE_ARN:
        description: "OIDC role ARN for AWS credentials"
        required: true
      AWS_DEPLOYMENT_ROLE_ARN:
        description: "Deployment role ARN for AWS credentials"
        required: true

jobs:
  build-push-s3:
    name: Build and publish release to S3 bucket
    if: ${{ inputs.enable }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    env:
      AWS_REGION: ${{ inputs.aws-region }}
      FRONTEND_S3_BUCKET: ${{ inputs.frontend-s3-bucket }}

    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print GitHub Context Safely
        run: |
          echo "--- GitHub Context ---"
          echo "${GITHUB_REPOSITORY}"
          echo "${GITHUB_REF}"
          echo "${GITHUB_SHA}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ format('v{0}', inputs.version) }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # todo maybe adjust with env specific config eg: pnpm build -- --configuration=${{ steps.resolve-inputs.outputs.configuration }}
        run: pnpm build

      - name: Validate deployment inputs  -- --configuration=${{ inputs.build-configuration }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z]+)*$ ]] || { echo "Invalid version"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "Invalid AWS region"; exit 1; }
          [[ "$FRONTEND_S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "Invalid S3 bucket"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-skip-session-tagging: true

      - name: Publish immutable release to S3
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "Publishing release: releases/v${VERSION}/"

          aws s3 sync "dist/" "s3://${FRONTEND_S3_BUCKET}/releases/v${VERSION}/" \
            --region "$AWS_REGION" \
            --delete \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync "dist/assets/" "s3://${FRONTEND_S3_BUCKET}/releases/v${VERSION}/assets/" \
            --region "$AWS_REGION" \
            --delete \
            --cache-control "no-cache"

          aws s3 cp "dist/index.html" "s3://${FRONTEND_S3_BUCKET}/releases/v${VERSION}/index.html" \
            --region "$AWS_REGION" \
            --cache-control "no-cache"

      - name: Display release info
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "✅ Release v${VERSION} published to releases/v${VERSION}/"
          echo "ℹ️  This release is not yet live. It goes live once the infrastructure PR bumping the version is merged."
