name: SonarQube
run-name: SonarQube
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        default: "24"
        type: string
      run-lint:
        description: "Run pnpm lint before the analysis"
        required: false
        default: true
        type: boolean
      run-tests:
        description: "Run pnpm test (for coverage) before the analysis. Disable for repos without unit tests."
        required: false
        default: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: "SonarQube authentication token"
        required: true

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: pnpm lint

      - name: Run unit tests
        if: ${{ inputs.run-tests }}
        run: pnpm test

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
