name: Unit Tests and SonarQube analysis for Java backend
run-name: Unit Tests and SonarQube
on:
  workflow_call:
    inputs:
      enable-integration-tests:
        description: >-
          Also run Maven integration tests (Failsafe, `*IT` classes). Uses `mvn verify` instead of
          `mvn test`, so the build reaches the package phase and any verify-bound plugin (Failsafe,
          aggregated JaCoCo report, Checkstyle) executes. Defaults to false so repositories without
          integration tests keep the faster unit-test-only run.
        required: false
        default: false
        type: boolean
      keycloak-ecr-pull-role-arn:
        description: >-
          Optional ARN of a GitHub-OIDC role that grants read-only pull on a private ECR repo holding
          a test container image (e.g. the custom Keycloak Dev Services testcontainer, A1A-312). When
          set, the job assumes it **directly** (no role chaining — ADR-1005, so pull_request runs that
          have no GitHub environment can still pull) and logs in to ECR before running the tests.
          Empty = no ECR login (default), which keeps this a no-op for callers that don't need it.
        required: false
        default: ''
        type: string
      aws-region:
        description: "AWS region for the ECR login; only used when keycloak-ecr-pull-role-arn is set."
        required: false
        default: ''
        type: string
    secrets:
      SONAR_TOKEN:
        description: "SonarQube authentication token"
        required: true
jobs:
  unit-test-sonarqube:
    name: Unit Tests and SonarQube
    runs-on: ubuntu-26.04
    # OIDC token is needed only when an ECR pull role is passed; harmless otherwise.
    permissions:
      id-token: write
      contents: read
    # Integration tests may start containers (e.g. Testcontainers), which does not fit in 10 minutes.
    timeout-minutes: ${{ inputs.enable-integration-tests && 20 || 10 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'corretto'

      # ADR-1005: assume the pull role directly (no role chaining) so pull_request runs can pull the
      # private-ECR test container. Runs only when the caller passes a role ARN (A1A-312).
      - name: Configure AWS credentials for ECR pull
        if: ${{ inputs.keycloak-ecr-pull-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.keycloak-ecr-pull-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to AWS ECR
        if: ${{ inputs.keycloak-ecr-pull-role-arn != '' }}
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Restore Maven Cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit Tests
        if: ${{ !inputs.enable-integration-tests }}
        run: mvn -B test -T 1C

      # `verify` runs Surefire and Failsafe in one reactor pass, so the integration tests see the
      # packaged artifacts of the upstream modules. Failsafe's `verify` goal is what fails the build
      # on a failing IT — `mvn integration-test` alone would report the failure but exit green.
      - name: Run Unit and Integration Tests
        if: ${{ inputs.enable-integration-tests }}
        run: mvn -B verify -T 1C

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -T 1C sonar:sonar -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml

      - name: Save Maven Cache
        uses: actions/cache/save@v5.1.0
        if: success()
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
