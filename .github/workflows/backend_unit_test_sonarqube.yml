name: Unit Tests and SonarQube analysis for Java backend
run-name: Unit Tests and SonarQube
on:
  workflow_call:
    inputs:
      enable-integration-tests:
        description: >-
          Also run Maven integration tests (Failsafe, `*IT` classes). Uses `mvn verify` instead of
          `mvn test`, so the build reaches the package phase and any verify-bound plugin (Failsafe,
          aggregated JaCoCo report, Checkstyle) executes. Defaults to false so repositories without
          integration tests keep the faster unit-test-only run.
        required: false
        default: false
        type: boolean
      ecr-pull-role-arn:
        description: >-
          ARN of an AWS role the tests assume via GitHub OIDC to pull private images from ECR (e.g. a
          Keycloak Dev Service image). Not a secret: it is passed literally, so the login also works on
          pull requests. Empty (default) skips the AWS and ECR login.
        required: false
        default: ''
        type: string
      aws-region:
        description: "AWS region of the ECR registry; required when ecr-pull-role-arn is set"
        required: false
        default: ''
        type: string
    secrets:
      SONAR_TOKEN:
        description: "SonarQube authentication token"
        required: true
jobs:
  unit-test-sonarqube:
    name: Unit Tests and SonarQube
    runs-on: ubuntu-26.04
    # Integration tests may start containers (e.g. Testcontainers), which does not fit in 10 minutes.
    timeout-minutes: ${{ inputs.enable-integration-tests && 20 || 10 }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'corretto'

      # The pull role is assumed directly, without role chaining, and its ARN is a plain input rather
      # than an environment secret, so pull-request runs can pull too (ADR-1005, exception to EK-003).
      - name: Configure AWS credentials for the ECR pull
        if: ${{ inputs.ecr-pull-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.ecr-pull-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to AWS ECR
        if: ${{ inputs.ecr-pull-role-arn != '' }}
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Restore Maven Cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit Tests
        if: ${{ !inputs.enable-integration-tests }}
        run: mvn -B test -T 1C

      # `verify` runs Surefire and Failsafe in one reactor pass, so the integration tests see the
      # packaged artifacts of the upstream modules. Failsafe's `verify` goal is what fails the build
      # on a failing IT — `mvn integration-test` alone would report the failure but exit green.
      - name: Run Unit and Integration Tests
        if: ${{ inputs.enable-integration-tests }}
        run: mvn -B verify -T 1C

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -T 1C sonar:sonar -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml

      - name: Save Maven Cache
        uses: actions/cache/save@v5.1.0
        if: success()
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
